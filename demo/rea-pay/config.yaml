# Rea Pay service configuration.
# DEMO FILE. Algorithm choices are hardcoded here on purpose so the
# scanner can flag the lack of crypto-agility.

service_name: rea-pay
environment: demo

# Token signing. RS256 means RSA-2048 signatures, forgeable post-quantum.
jwt_algorithm: RS256
jwt_ttl_days: 30

# Transport. Pinned below TLS 1.3, which blocks hybrid PQ key exchange.
tls_min_version: "1.2"
tls_cipher_suites: "ECDHE-RSA-AES128-SHA"

# Key management. RSA-2048 wrapping keys, stored in software for the demo.
kms_key_type: RSA_2048
kms_provider: software

# Ledger signing curve. Hardcoded secp256k1.
signing_curve: secp256k1

# HSM. Points at a software token; the production HSM vendor has not
# confirmed a PQC firmware roadmap.
hsm_provider: SoftHSMv2
hsm_pkcs11_library: /usr/lib/softhsm/libsofthsm2.so

# Certificates.
tls_cert_path: keys/server-rsa.crt
